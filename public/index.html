<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="Copter Cave — un hélicoptère dans un tunnel qui se resserre. Maintenez pour monter, relâchez pour descendre.">
  <title>Copter Cave — OhDjiGames</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="hub-link" href="https://ohdji.dev" aria-label="Retour au hub OhDjiGames">&#9664; HUB</a>

  <main id="game" class="game">
    <canvas id="canvas" class="canvas" aria-label="Zone de jeu Copter Cave"></canvas>

    <div id="hud" class="hud" hidden>
      <span id="score" class="score">0</span>
    </div>

    <section id="menu" class="overlay overlay--center">
      <h1 class="title">COPTER<br>CAVE</h1>
      <p class="tagline">Maintenez pour monter<br>relâchez pour descendre</p>
      <p class="highscore"><span class="highscore__label">Meilleur score&nbsp;:</span> <span id="menu-highscore" class="highscore__value">0</span></p>
      <p class="hint">Espace · clic · toucher</p>
    </section>

    <section id="gameover" class="overlay overlay--center" hidden>
      <h2 class="title title--small">GAME OVER</h2>
      <p class="score-label">Score</p>
      <p id="final-score" class="final-score">0</p>
      <p class="score-label">Meilleur score</p>
      <p id="best-score" class="best-score">0</p>
      <button id="restart" type="button" class="btn">Rejouer</button>
      <p class="hint">Espace · clic · toucher</p>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
